# Translates a recorded KiCad draw stream into gpui primitives.
#
# There is deliberately no wgpu dependency here. gpui owns the device, the
# queue and the render pass and exposes no hook into any of them, so the way to
# reach the GPU is to emit gpui's own primitives and let its renderer (wgpu,
# 4x MSAA) rasterise them. See docs/rust-migration/02-gpui-kit-cookbook.md §3.
#
# The dependency is on `gpui-pre` directly rather than on the `gpui-kit` facade:
# this crate needs the core element and path API and none of the widget
# library, and `gpui-kit` pins the same `gpui-pre` version, so the shell and
# this crate still share one set of types.

[package]
name = "kicad-sch-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Renders the KiCad GAL draw stream through gpui"

[dependencies]
kicad-gal = { path = "../kicad-gal", version = "0.1.0" }
gpui = { version = "0.3.5", package = "gpui-pre" }
# gpui re-exports lyon's StrokeOptions but not LineCap/LineJoin. Resolving to
# the same lyon_tessellation gpui itself uses keeps the types identical.
lyon_tessellation = "1.0.22"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "frame"
harness = false
