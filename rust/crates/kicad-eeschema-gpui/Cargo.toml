# Thin binary that starts the schematic editor shell. Everything of substance
# lives in `kicad-sch-ui`; this crate exists so there is something runnable and
# so the shell stays a library that tests can drive without a `main`.

[package]
name = "kicad-eeschema-gpui"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runnable gpui-kit front end for the KiCad schematic editor"

[[bin]]
# The file name CMake's eeschema_gpui target declares as its output, and the one
# that sits beside `eeschema` in a build tree. With the package name here instead,
# ninja would be waiting for a file cargo never writes and would rebuild the crate
# on every invocation.
name = "eeschema-gpui"
path = "src/main.rs"

[dependencies]
kicad-gal = { path = "../kicad-gal" }
kicad-sch-ui.workspace = true
kicad-sch-render.workspace = true
# Opening a `.kicad_sch` rather than a recorded stream. Builds without the C++
# host too, and then says so when asked to open one.
kicad-sch-sys.workspace = true
gpui-kit = "0.6.1"
